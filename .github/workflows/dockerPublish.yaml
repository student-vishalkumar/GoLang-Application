name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write   # needed to comment on the PR

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

      # ---- Check 1: Docker image is created ----
      - name: Build Docker image
        id: docker_build
        run: docker build -t dev878vishal/my-go-app:${{ github.sha }} .

      # ---- Check 2: coverage.out exists (only if the image step succeeded) ----
      - name: Check coverage.out exists
        id: cov_check
        if: steps.docker_build.outcome == 'success'
        run: |
          if [ ! -s coverage.out ]; then
            echo "coverage.out missing or empty"; exit 1
          fi

      # ---- Read coverage.out and build the table ----
      - name: Build coverage table
        id: cov_table
        if: steps.cov_check.outcome == 'success'
        run: |
          # coverage.out lines look like: file:start,end <numStmts> <count>
          read total covered < <(awk 'NR>1 {t+=$2; if ($3>0) c+=$2} END {print t, c}' coverage.out)
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')

          {
            echo "### Code Coverage Report"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Total Statements | $total |"
            echo "| Total Covered | $covered |"
            echo "| Code Coverage | $pct |"
          } > coverage-table.md

          cat coverage-table.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment table on PR
        if: github.event_name == 'pull_request' && steps.cov_table.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file coverage-table.md --edit-last --create-if-none

      # ---- Push only on commits to master ----
      - name: Login to Docker Hub
        if: github.event_name == 'push' && steps.docker_build.outcome == 'success'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && steps.docker_build.outcome == 'success'
        run: docker push dev878vishal/my-go-app:${{ github.sha }}