name: ci

on:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

      # ---- Check 1: Docker image is created ----
      - name: Build Docker image
        id: docker_build
        run: docker build -t dev878vishal/my-go-app:${{ github.sha }} .

      # ---- Check 2: coverage.out exists ----
      - name: Check coverage.out exists
        id: cov_check
        if: steps.docker_build.outcome == 'success'
        run: |
          if [ ! -s coverage.out ]; then
            echo "coverage.out missing or empty"; exit 1
          fi

      # ---- Build the table from coverage.out ----
      - name: Build coverage table
        id: cov_table
        if: steps.cov_check.outcome == 'success'
        run: |
          read total covered < <(awk 'NR>1 {t+=$2; if ($3>0) c+=$2} END {print t, c}' coverage.out)
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')

          {
            echo "### Code Coverage Report"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Total Statements | $total |"
            echo "| Total Covered | $covered |"
            echo "| Code Coverage | $pct |"
          } > coverage-table.md

          cat coverage-table.md >> "$GITHUB_STEP_SUMMARY"

      # ---- Find the PR (if this commit came from a merge) ----
      - name: Find PR for this commit
        id: find_pr
        if: steps.cov_table.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].number // empty')
          echo "pr_number=$pr" >> "$GITHUB_OUTPUT"

      - name: Comment table on PR
        if: steps.find_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ steps.find_pr.outputs.pr_number }} --body-file coverage-table.md

      - name: Login to Docker Hub
        if: steps.docker_build.outcome == 'success'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: steps.docker_build.outcome == 'success'
        run: docker push dev878vishal/my-go-app:${{ github.sha }}